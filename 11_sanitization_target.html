<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Support Portal</title>
    
    <script>
        /**
         * @typedef {Object} AppConfig
         * @property {string} env
         * @property {string} apiVersion
         */

        // Global Config - Sanitized to remove hardcoded credentials
        window.APP_CONFIG = Object.freeze({
            env: "production",
            apiVersion: "v1"
        });
    </script>
</head>
<body>
    <div id="app">
        <header>
            <h1>Customer Support Portal</h1>
            <div class="user-profile">
                <!-- PII removed from DOM data attributes; state managed via secure closures or runtime tokens -->
                <span id="current-user">
                    Welcome back, User
                </span>
            </div>
        </header>

        <main>
            <section class="recent-orders">
                <h2>Recent Order Queries</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Customer</th>
                            <th>Address</th>
                            <th>Payment Method</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>John Smith</td>
                            <td>42 Wallaby Way, Sydney NSW 2000</td>
                            <!-- Sensitive full PAN and CVV removed from client-side markup -->
                            <td>Visa ending in 4111</td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <script>
        /**
         * Fetches customer data securely using dynamic runtime configuration and proper error sanitization.
         * @param {string} customerId 
         * @returns {Promise<Object|null>}
         */
        async function fetchCustomerData(customerId) {
            // Validation of customerId to prevent injection or malformed requests
            if (!customerId || typeof customerId !== 'string') {
                throw new TypeError('Invalid customer ID provided.');
            }

            try {
                // Authentication tokens and API keys are expected to be injected via secure environment variables or session headers
                const response = await fetch(`https://api.internal-system.com/v1/users/${encodeURIComponent(customerId)}`, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    credentials: 'same-origin'
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                const data = await response.json();
                
                // Sensitive medical or PII logging removed for compliance and privacy standards
                return data;
            } catch (error) {
                // Secure error logging without leaking credentials or internal stack traces to third-party query strings
                console.error("An error occurred while fetching customer data.");
                return null;
            }
        }
    </script>
</body>
</html>
