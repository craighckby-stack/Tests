<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline';">
    <title>Customer Support Portal</title>
    
    <script>
        /**
         * @typedef {Object} AppConfig
         * @readonly
         * @property {string} env
         * @property {string} apiVersion
         */

        /** @type {AppConfig} */
        window.APP_CONFIG = Object.freeze({
            env: "production",
            apiVersion: "v1"
        });
    </script>
</head>
<body>
    <div id="app">
        <header>
            <h1>Customer Support Portal</h1>
            <div class="user-profile">
                <span id="current-user">
                    Welcome back, User
                </span>
            </div>
        </header>

        <main>
            <section class="recent-orders">
                <h2>Recent Order Queries</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Customer</th>
                            <th>Address</th>
                            <th>Payment Method</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>John Smith</td>
                            <td>42 Wallaby Way, Sydney NSW 2000</td>
                            <td>Visa ending in 4111</td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <script>
        /**
         * Fetches customer data securely using dynamic runtime configuration, strict type validation, and robust error management.
         * @param {string} customerId 
         * @returns {Promise<Record<string, unknown>|null>}
         */
        async function fetchCustomerData(customerId) {
            'use strict';
            
            if (typeof customerId !== 'string' || !customerId.trim()) {
                throw new TypeError('Invalid or missing customer ID provided.');
            }

            const sanitizedId = encodeURIComponent(customerId.trim());
            const endpoint = `https://api.internal-system.com/${window.APP_CONFIG.apiVersion}/users/${sanitizedId}`;

            try {
                const response = await fetch(endpoint, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    credentials: 'same-origin',
                    cache: 'no-store'
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error status: ${response.status} ${response.statusText}`);
                }

                /** @type {Record<string, unknown>} */
                const data = await response.json();
                return data;
            } catch (error) {
                console.error("[EMG Neural Core] Secure data retrieval failure:", error instanceof Error ? error.message : String(error));
                return null;
            }
        }
    </script>
</body>
</html>
